<title>Seu plano de trabalho — StarTouch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

<style>
  /* ── Design system (adotado da maquete premium, enxertado nos dados reais) ── */
  :root{
    --blue:#1A73E8; --blue2:#4285F4; --blue-soft:#E8F0FE; --line-blue:#D7E3FC;
    --purple:#6D5DFB;
    --ink:#0F172A; --ink-2:#475569; --ink-3:#64748B; --line:#E2E8F0;
    --bg:#FFFFFF; --surf:#F8FAFF;
    --dark:#071426; --dark2:#0C2349; --dark-hi:#8EA8FF; --dark-sub:#AFC0D8;
    --ok:#1E8E3E; --ok-soft:#E6F4EA; --amber:#D97706; --red:#C2413A;
    --shadow:0 24px 80px rgba(15,23,42,.10); --shadow-soft:0 16px 48px rgba(26,115,232,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.5;}
  a{text-decoration:none;color:inherit;}
  .tnums{font-variant-numeric:tabular-nums;}
  .container{width:min(100% - 40px, 1040px);margin-inline:auto;}
  h1,h2,h3,h4,p{margin:0;}

  /* Topbar */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);border-bottom:1px solid rgba(226,232,240,.8);backdrop-filter:blur(16px);}
  .topbar-inner{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand img{height:30px;width:auto;display:block;}
  .brand .tag{color:var(--ink-3);font-size:11.5px;font-weight:800;letter-spacing:.08em;}
  .top-meta{color:var(--blue);font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;}

  /* Loader / estados */
  .boot{text-align:center;padding:120px 20px;color:var(--ink-2);}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  section{padding:64px 0;}
  .section-label{color:var(--blue);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;}
  .section-h{font-size:clamp(28px,5vw,46px);line-height:1.06;letter-spacing:-.045em;font-weight:900;text-wrap:balance;}
  .section-sub{margin-top:14px;color:var(--ink-2);font-size:16px;line-height:1.62;max-width:720px;}

  /* ── Hero (banda escura) ── */
  .hero{position:relative;padding:64px 0 72px;color:#fff;overflow:hidden;
    background:radial-gradient(circle at 82% 28%,rgba(66,133,244,.26),transparent 22rem),radial-gradient(circle at 26% 92%,rgba(109,93,251,.18),transparent 20rem),linear-gradient(135deg,var(--dark),var(--dark2) 62%,#0A1830);}
  .hero::after{content:"";position:absolute;inset:auto 0 0 0;height:160px;background:radial-gradient(ellipse at 22% 100%,rgba(66,133,244,.4),transparent 32%),radial-gradient(ellipse at 62% 100%,rgba(109,93,251,.32),transparent 34%);opacity:.55;filter:blur(18px);}
  .hero-grid{position:relative;z-index:1;display:grid;gap:32px;align-items:center;}
  .hero-eyebrow{color:#9CBFFF;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.11em;margin-bottom:14px;}
  .hero h1{font-size:clamp(32px,6vw,58px);line-height:1.02;letter-spacing:-.055em;font-weight:900;text-wrap:balance;}
  .hero-lead{margin-top:18px;max-width:620px;color:#D5E0F2;font-size:16.5px;line-height:1.6;}
  .status-pill{margin-top:24px;display:inline-flex;align-items:center;gap:10px;padding:10px 15px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:800;}
  .status-dot{width:10px;height:10px;border-radius:999px;flex:0 0 auto;}
  .status-dot.no{background:#FF6B6B;box-shadow:0 0 16px rgba(255,107,107,.7);}
  .status-dot.part{background:#FBBF24;box-shadow:0 0 16px rgba(251,191,36,.7);}
  .status-dot.ok{background:#34D399;box-shadow:0 0 16px rgba(52,211,153,.7);}

  .score-panel{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;padding:20px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(255,255,255,.06);backdrop-filter:blur(12px);box-shadow:0 22px 60px rgba(0,0,0,.18);}
  .score-ring{width:132px;height:132px;position:relative;display:grid;place-items:center;margin:0 auto;}
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;}
  .score-ring .val b{font-size:40px;font-weight:900;letter-spacing:-.05em;line-height:1;}
  .score-ring .val span{display:block;margin-top:2px;color:var(--dark-sub);font-size:11px;}
  .score-copy small{display:block;color:var(--dark-sub);font-size:12px;margin-bottom:6px;}
  .score-copy .lbl{color:#F6B73C;font-size:22px;line-height:1.08;letter-spacing:-.03em;font-weight:900;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:7px 11px;font-size:12.5px;color:var(--dark-sub);}
  .chip b{color:#fff;}

  /* ── O que encontramos (a PROVA lidera; fundo claro, cartão escuro) ── */
  .findings{background:var(--surf);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  /* Cartão de prova — a resposta literal da IA, tratada como evidência. */
  .ev{background:var(--dark);color:#fff;border-radius:20px;padding:22px;margin-top:30px;box-shadow:var(--shadow);}
  .ev-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .ev-engine{font-size:12px;font-weight:900;color:var(--dark-sub);text-transform:uppercase;letter-spacing:.06em;}
  .ev-flag{font-size:11.5px;font-weight:900;border-radius:7px;padding:4px 9px;white-space:nowrap;}
  .ev-flag.no{background:rgba(255,107,107,.16);color:#FF9B9B;}
  .ev-flag.ok{background:rgba(52,211,153,.16);color:#6EE7B7;}
  .ev-q{font-size:15px;font-weight:800;color:#fff;line-height:1.4;}
  .ev-a{margin:13px 0 0;padding:2px 0 2px 14px;border-left:2px solid var(--dark-hi);color:#C7D5EA;font-size:14px;line-height:1.72;white-space:pre-line;}
  .ev-hl{font-weight:800;color:#fff;}
  .ev-me{font-weight:800;color:#8EA8FF;}
  .ev-comp{margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:var(--dark-sub);line-height:1.5;}
  .ev-comp b{color:#fff;}
  .ev-bridge{margin-top:11px;font-size:13px;color:var(--dark-sub);line-height:1.5;}
  .ev-bridge b{color:#fff;}
  .ev-comp + .ev-bridge{margin-top:7px;border-top:0;padding-top:0;}

  /* Medida: concorrentes + veredito + nicho×busca, em cartão claro */
  .measure{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 34px rgba(15,23,42,.05);}
  .measure .q{font-size:14px;color:var(--ink-2);line-height:1.5;margin-bottom:14px;}
  .measure .q b{color:var(--ink);}
  .compbar{display:flex;align-items:center;gap:12px;margin:9px 0;}
  .compbar .nm{font-size:13.5px;width:140px;flex:0 0 auto;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .compbar .track{flex:1;height:9px;background:var(--blue-soft);border-radius:999px;overflow:hidden;}
  .compbar .fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:999px;}
  .miss{margin-top:16px;padding-top:15px;border-top:1px solid var(--line);font-size:14.5px;font-weight:800;color:var(--red);display:flex;align-items:center;gap:9px;}
  .miss.inrank{color:var(--ok);}
  .miss svg{width:18px;height:18px;flex:0 0 auto;}
  .bt{margin-top:16px;padding-top:15px;border-top:1px solid var(--line);}
  .bt-title{font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:10px;}
  .bt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;}
  .bt-row + .bt-row{border-top:1px solid var(--surf);}
  .bt-term{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bt-count{font-size:12.5px;font-weight:900;border-radius:7px;padding:3px 10px;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .bt-count.ok{background:var(--ok-soft);color:var(--ok);}
  .bt-count.no{background:#FCE8E6;color:var(--red);}
  .bt-punch{margin-top:12px;font-size:14px;color:var(--ink-2);line-height:1.55;}
  .bt-punch b{color:var(--ink);}
  .localrank{margin-top:16px;}
  .lr{background:var(--blue-soft);border:1px solid var(--line-blue);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--ink);line-height:1.5;display:flex;align-items:flex-start;gap:9px;}
  .lr b{font-weight:800;} .lr-sub{color:var(--ink-3);}
  .lr svg{width:18px;height:18px;stroke:var(--blue);flex-shrink:0;margin-top:1px;}
  .lr.miss-lr{background:#FCE8E6;border-color:#F5C6C0;} .lr.miss-lr svg{stroke:var(--red);}

  /* ── Por que importa (explanation) + A boa notícia (aside) ── */
  .explain{background:linear-gradient(180deg,#F8FAFF,#fff);border-bottom:1px solid var(--line);}
  .explain-grid{display:grid;gap:28px;align-items:start;}
  .signals{display:grid;gap:12px;margin-top:24px;}
  .signal{border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px;display:flex;align-items:flex-start;gap:12px;}
  .signal-num{width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;border-radius:10px;color:var(--blue);background:var(--blue-soft);font-weight:900;font-size:14px;}
  .signal b{display:block;font-size:14.5px;margin-bottom:4px;color:var(--ink);}
  .signal p{color:var(--ink-2);font-size:13px;line-height:1.45;}
  .good-news{border:1px solid var(--line-blue);border-radius:24px;background:#fff;box-shadow:var(--shadow-soft);padding:26px;position:sticky;top:88px;}
  .good-news .ico{width:50px;height:50px;display:grid;place-items:center;border-radius:15px;background:var(--blue-soft);color:var(--blue);margin-bottom:16px;}
  .good-news .ico svg{width:26px;height:26px;stroke:var(--blue);}
  .good-news h3{font-size:clamp(24px,3.6vw,34px);line-height:1.06;letter-spacing:-.04em;font-weight:900;}
  .good-news p{margin-top:13px;color:var(--ink-2);font-size:14.5px;line-height:1.6;}
  .sol-count{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.5;display:none;}
  .sol-count b{color:var(--blue);font-size:16px;}

  /* ── Protocolo (banda escura, grade) ── */
  .protocol{color:#fff;background:radial-gradient(circle at 85% 18%,rgba(109,93,251,.24),transparent 20rem),linear-gradient(135deg,var(--dark),var(--dark2));}
  .protocol .section-label{color:#9CBFFF;}
  .proto-badge{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:800;color:#CAD7EA;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 14px;margin:0 0 16px;}
  .proto-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--dark-hi);box-shadow:0 0 0 4px rgba(142,168,255,.2);}
  .protocol .section-sub{color:#CAD7EA;}
  .protocol-grid{margin-top:32px;display:grid;gap:14px;}
  .protocol-item{border:1px solid rgba(255,255,255,.14);border-radius:18px;background:rgba(255,255,255,.04);padding:20px;}
  .protocol-item .num{color:var(--dark-hi);font-size:12px;font-weight:900;letter-spacing:.08em;margin-bottom:12px;}
  .protocol-item h3{color:#fff;font-size:16.5px;font-weight:900;letter-spacing:-.02em;}
  .protocol-item p{margin-top:9px;color:#BFD0E8;font-size:13.2px;line-height:1.55;}

  /* ── Bastidores (check-list + motor) ── */
  .backstage-grid{display:grid;gap:30px;align-items:center;}
  .check-list{display:grid;gap:12px;margin-top:26px;}
  .check{display:flex;align-items:flex-start;gap:11px;color:var(--ink-2);font-size:14.5px;line-height:1.5;font-weight:600;}
  .check .ck{width:22px;height:22px;flex:0 0 22px;border-radius:999px;display:grid;place-items:center;background:var(--blue);color:#fff;margin-top:1px;}
  .check .ck svg{width:13px;height:13px;stroke:#fff;stroke-width:3;}
  .engine-visual{min-height:300px;display:grid;place-items:center;position:relative;}
  .engine-core{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#233E7E 0 24%,#102451 25% 48%,#08172F 49% 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 30px 60px rgba(15,23,42,.22);position:relative;display:grid;place-items:center;}
  .engine-core::before,.engine-core::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(109,93,251,.28);}
  .engine-core::before{inset:-32px;} .engine-core::after{inset:-66px;}
  .engine-star{width:78px;height:78px;border-radius:26px;display:grid;place-items:center;color:#FFD34D;background:#0A1730;box-shadow:0 0 40px rgba(255,211,77,.35);}
  .engine-lines{position:absolute;inset:0;pointer-events:none;}
  .engine-lines::before,.engine-lines::after{content:"";position:absolute;top:50%;width:110px;height:1px;background:linear-gradient(90deg,transparent,#7C8BFF);}
  .engine-lines::before{left:0;} .engine-lines::after{right:0;transform:scaleX(-1);}

  /* ── Oferta / CTA (banda escura premium com checkout real) ── */
  .cta{padding:56px 0 68px;}
  .cta-card{border-radius:28px;padding:30px;color:#fff;box-shadow:var(--shadow);
    background:radial-gradient(circle at 12% 45%,rgba(109,93,251,.2),transparent 16rem),linear-gradient(135deg,var(--dark),#171359);}
  .cta-card h2{font-size:clamp(26px,4.4vw,40px);line-height:1.08;letter-spacing:-.04em;font-weight:900;text-wrap:balance;}
  .incl{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px;}
  .incl li{display:flex;gap:10px;font-size:14.5px;color:#DCE6F5;}
  .incl li svg{width:18px;height:18px;stroke:var(--dark-hi);flex:0 0 auto;margin-top:1px;}
  .price{display:flex;align-items:baseline;gap:10px;margin:24px 0 4px;}
  .price .v{font-size:40px;font-weight:900;letter-spacing:-.03em;}
  .price .per{color:var(--dark-sub);font-size:14px;}
  .anchor{font-size:13px;color:var(--dark-sub);margin-bottom:20px;}
  .anchor b{color:var(--dark-hi);}
  .lead-form{display:grid;gap:12px;}
  .lf-field{display:grid;gap:6px;}
  .lf-field label{font-size:12px;font-weight:800;color:var(--dark-sub);}
  .lf-field input{width:100%;height:52px;border:1px solid rgba(255,255,255,.18);border-radius:13px;background:rgba(255,255,255,.06);color:#fff;padding:0 15px;font-family:inherit;font-size:15px;outline:none;transition:border-color .15s,background .15s;}
  .lf-field input::placeholder{color:#7C8DA6;}
  .lf-field input:focus{border-color:var(--dark-hi);background:rgba(255,255,255,.1);}
  .cta-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:5px;border:0;height:58px;border-radius:14px;color:#fff;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 16px 36px rgba(109,93,251,.26);background:linear-gradient(135deg,var(--blue),var(--purple));transition:filter .15s;}
  .cta-btn:hover{filter:brightness(1.06);}
  .cta-btn:disabled{opacity:.6;cursor:progress;}
  .lf-err{margin-top:4px;background:rgba(252,232,230,.12);border:1px solid #F5C6C0;border-radius:10px;padding:10px 12px;color:#FF9B9B;font-size:13px;line-height:1.45;}
  .undercta{text-align:center;font-size:12.5px;color:var(--dark-sub);margin-top:13px;}
  .cta-ghost{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:12px;background:transparent;border:1px solid rgba(255,255,255,.2);color:#D7E3FC;font-size:14.5px;font-weight:700;height:50px;border-radius:12px;transition:background .15s;}
  .cta-ghost:hover{background:rgba(255,255,255,.07);}
  .cta-ghost svg{width:17px;height:17px;stroke:#D7E3FC;}

  .pagefoot{padding:28px 0 40px;text-align:center;font-size:12px;color:var(--ink-3);line-height:1.5;}

  /* Fade-up discreto no scroll */
  .reveal-up{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease;}
  .reveal-up.in{opacity:1;transform:none;}
  @media(prefers-reduced-motion:reduce){.reveal-up{opacity:1 !important;transform:none !important;transition:none;}}

  /* ── Desktop ── */
  @media(min-width:820px){
    .hero-grid{grid-template-columns:1fr .8fr;}
    .explain-grid{grid-template-columns:1fr .82fr;}
    .protocol-grid{grid-template-columns:repeat(4,1fr);}
    .backstage-grid{grid-template-columns:1fr .82fr;}
    .cta-card{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center;padding:40px;}
    .cta-lead{max-width:none;}
  }
  @media(max-width:819px){
    .score-panel{grid-template-columns:1fr;text-align:center;}
    .chips{justify-content:center;}
    .good-news{position:static;}
  }
</style>
</head>
<body>
<header class="topbar"><div class="container topbar-inner">
  <a class="brand" href="/landing" aria-label="StarTouch"><img src="/startouch-logo-dark.png" alt="StarTouch"/><span class="tag">IA RADAR</span></a>
  <span class="top-meta">Plano de trabalho</span>
</div></header>

<main>
  <div id="boot" class="boot"><div class="spinner"></div><p>Montando seu plano de trabalho…</p></div>
  <div id="page" style="display:none;"></div>
  <div id="pagefoot" class="pagefoot" style="display:none;">
    Diagnóstico gerado a partir de perguntas reais a inteligências artificiais e de dados públicos do seu Google e do seu site.
  </div>
</main>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const CODE = (params.get("code") || "").trim();
  const ORIGEM = (params.get("origem") || "direct").trim();

  // Sem code → não há plano pra mostrar: manda rodar o diagnóstico. replace()
  // pra não deixar a URL quebrada no histórico.
  if (!CODE) { location.replace("/radar"); return; }

  function esc(s){ const d = document.createElement("div"); d.textContent = (s==null?"":String(s)); return d.innerHTML; }

  const ENGINE_LABELS = { gemini:"Gemini", openai:"ChatGPT", perplexity:"Perplexity" };
  function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  // As IAs respondem em Markdown. Sem tratar, o cliente lê "* **Dona Deôla**:"
  // com os asteriscos na cara. Roda DEPOIS do esc() (texto já seguro) e ANTES do
  // highlight, que injeta <span>. Os negritos do Markdown somem: quem merece
  // destaque aqui são os concorrentes, e disso o highlight cuida.
  function stripMarkdown(t){
    return t
      .replace(/\*\*(.+?)\*\*/g, "$1")        // **negrito**
      .replace(/(^|\n)\s*[*-]\s+/g, "$1• ")   // marcador no início da linha
      .replace(/\s+\*\s+/g, "\n• ")           // marcador INLINE: a IA nem sempre quebra linha
      .replace(/\n{3,}/g, "\n\n");
  }
  // Destaca, no texto JÁ escapado, os nomes da lista. Mais longos primeiro, pra
  // não destacar pedaço de nome. Uma passada só.
  function highlight(escapedText, names, cls){
    const list = (names || []).map(n => (n || "").trim()).filter(Boolean).sort((a,b) => b.length - a.length);
    if (!list.length) return escapedText;
    return escapedText.replace(new RegExp("(" + list.map(escRe).join("|") + ")", "gi"), '<span class="' + cls + '">$1</span>');
  }
  // Escolhe a pergunta mais eloquente entre TODOS os motores: (1) não citado E
  // com concorrentes nomeados; (2) só não citado; (3) citado. Ver contrato.
  function pickEvidence(diag){
    const todos = [];
    Object.keys(diag.porMotor || {}).forEach(m =>
      (diag.porMotor[m].itens || []).forEach(it => todos.push({ ...it, motor: m })));
    if (!todos.length) return null;
    return todos.find(it => !it.mencionado && (it.concorrentes || []).length)
        || todos.find(it => !it.mencionado)
        || todos.find(it => it.mencionado)
        || todos[0];
  }
  // ── Aparece no NICHO ou na BUSCA AMPLA? (mesma lógica de antes) ──
  function breakdownPorTermo(diag){
    const produtos = (diag.produtos || []).map(p => normComp(p)).filter(Boolean);
    if (!produtos.length) return null;
    const arena = { termo: diag.categoria || "sua categoria", mencoes: 0, total: 0 };
    const nicho = { termo: (diag.produtos || [])[0] || "", mencoes: 0, total: 0 };
    Object.values(diag.porMotor || {}).forEach(pm => (pm.itens || []).forEach(it => {
      const q = normComp(it.pergunta || "");
      const alvo = produtos.some(p => q.includes(p)) ? nicho : arena;
      alvo.total++;
      if (it.mencionado) alvo.mencoes++;
    }));
    if (!nicho.total || !arena.total) return null;
    return { arena, nicho };
  }
  function renderBreakdown(diag){
    const b = breakdownPorTermo(diag);
    if (!b) return "";
    const { arena, nicho } = b;
    const linha = (x) =>
      '<div class="bt-row">' +
        '<span class="bt-term">' + esc(x.termo) + '</span>' +
        '<span class="bt-count ' + (x.mencoes ? "ok" : "no") + '">' +
          (x.mencoes ? x.mencoes + ' de ' + x.total : '0 de ' + x.total) +
        '</span>' +
      '</div>';
    let punch = "";
    if (!arena.mencoes && nicho.mencoes)
      punch = 'Você aparece quando pedem <b>' + esc(nicho.termo) + '</b> — e some quando pedem <b>' + esc(arena.termo) + '</b>. Quem não conhece você ainda, não te encontra.';
    else if (arena.mencoes && !nicho.mencoes)
      punch = 'Você aparece na busca ampla por <b>' + esc(arena.termo) + '</b>, mas não em <b>' + esc(nicho.termo) + '</b> — onde a concorrência é menor.';
    return '<div class="bt">' +
      '<div class="bt-title">Em quais buscas você aparece</div>' +
      linha(arena) + linha(nicho) +
      (punch ? '<div class="bt-punch">' + punch + '</div>' : '') +
    '</div>';
  }

  // O cartão de prova. A resposta literal da IA é o argumento.

    if (t > 0) {

  // ===================== dados reais (/api/radar) =====================
  function ringDash(score){ const r=56, c=2*Math.PI*r; return { c, off:c*(1-Math.max(0,Math.min(100,score))/100), r }; }

  const normComp = (s) => (s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  function mesmoNegocio(a, b){
    if (a === b) return true;
    const [curto, longo] = a.length <= b.length ? [a, b] : [b, a];
    return longo.startsWith(curto) && /^[\s\-–—,:|]/.test(longo.slice(curto.length));
  }
  function competitorsFromDiag(diag){
    const grupos = [];
    Object.values(diag.porMotor || {}).forEach(pm => (pm.itens || []).forEach(it => {
      (it.concorrentes || []).forEach(c => {
        const nome = (c||"").trim(); const k = normComp(nome); if (!k) return;
        const g = grupos.find(x => mesmoNegocio(x.key, k));
        if (g) { g.n++; if (nome.length < g.name.length) { g.name = nome; g.key = k; } }
        else grupos.push({ key:k, name:nome, n:1 });
      });
    }));
    let ranked = grupos.sort((a,b) => b.n - a.n).slice(0, 4);
    if (!ranked.length) ranked = (diag.concorrentes || []).slice(0, 4).map(n => ({ name: n, n: 0 }));
    return ranked;
  }

  // Estado (ausente / parcial / presente) → rótulos honestos, state-aware.
  function estado(diag){
    const m = diag.mencoes || 0, t = diag.total || 0;
    if (t > 0 && m === t) return "ok";
    if (m > 0) return "part";
    return "no";
  }

  // ── O QUE ENCONTRAMOS: a PROVA lidera; depois a medida (concorrentes, veredito) ──
  function renderDiagnostico(diag){
    const total = diag.total || 0;
    const ranked = competitorsFromDiag(diag);
    const maxN = Math.max(1, ...ranked.map(x => x.n));
    const comps = ranked.map(x => {
      const w = x.n ? Math.round((x.n / maxN) * 100) : 40;
      return '<div class="compbar"><div class="nm">' + esc(x.name) + '</div>' +
        '<div class="track"><div class="fill" style="width:' + Math.max(12, w) + '%"></div></div></div>';
    }).join("");

    const appeared = (diag.mencoes || 0) > 0;
    const missTxt = appeared
      ? "A " + esc(diag.nome) + " apareceu em " + diag.mencoes + " de " + total + " buscas."
      : "A " + esc(diag.nome) + " não apareceu em nenhuma das " + total + " buscas.";
    const evidence = renderEvidence(diag);

    const st = estado(diag);
    const sub = st === "ok"
      ? "Sua empresa já é lembrada pelas IAs quando procuram pela sua categoria. O trabalho aqui é manter e ampliar essa posição."
      : st === "part"
      ? "Em algumas buscas sua empresa aparece; em outras, um concorrente aparece no seu lugar. Veja a diferença abaixo."
      : "Quando alguém pergunta a uma IA pela sua categoria, a resposta cita concorrentes — e não menciona a sua empresa. Não é acaso: é o que os sinais públicos dizem hoje.";

    const measure = ranked.length ? (
      '<div class="measure">' +
        '<div class="q">Fizemos <b>' + total + ' buscas</b> como essa e medimos quem as IAs citam:</div>' +
        comps +
        '<div class="miss ' + (appeared ? "inrank" : "") + '">' + (appeared ? ICON.check : ICON.alert) + ' ' + missTxt + '</div>' +
        renderBreakdown(diag) +
        '<div class="localrank" id="localRank"></div>' +
      '</div>'
    ) : (
      '<div class="measure"><div class="miss ' + (appeared ? "inrank" : "") + '">' + (appeared ? ICON.check : ICON.alert) + ' ' + missTxt + '</div>' +
        '<div class="localrank" id="localRank"></div></div>'
    );

    return '<section class="findings"><div class="container">' +
      '<div class="section-label">01 · O diagnóstico</div>' +
      '<h2 class="section-h">O que encontramos</h2>' +
      '<p class="section-sub">' + sub + '</p>' +
      evidence + measure +
    '</div></section>';
  }

      gtag("event", "generate_lead", { value: 599, currency: "BRL", event_callback: go });
      setTimeout(go, 1200);
    } else { go(); }
  }
  // client_id/session_id do GA4 (cookies) pra amarrar a venda à origem no webhook.
  function gaIds(){
    try {
      const cid = (document.cookie.match(/_ga=GA\d\.\d\.(\d+\.\d+)/) || [])[1] || "";
      const sid = (document.cookie.match(/_ga_HCLV0Z640L=GS\d\.\d\.(\d+)/) || [])[1] || "";
      return { ga_client_id: cid, ga_session_id: sid };
    } catch (_) { return { ga_client_id: "", ga_session_id: "" }; }
  }
  // Checkout do Pacote Presença em IA.
  function wireCheckout(diag){
    const btn = $("contratarBtn");
    if (!btn) return;
    btn.addEventListener("click", async () => {
      const nome = $("leadNome").value.trim();
      const email = $("leadEmail").value.trim();
      const whatsapp = $("leadWhats").value.trim();
      const err = $("leadErr");
      err.innerHTML = "";
      if (!nome || !email) { err.innerHTML = '<div class="lf-err">Preencha seu nome e email.</div>'; return; }
      btn.disabled = true;
      const label = btn.textContent;
      btn.textContent = "Gerando pagamento…";
      try {
        const local = diag.local || {};
        const r = await fetch("/api/billing?action=checkout-ia", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nome, email, whatsapp,
            biz_name: diag.nome || "",
            cidade: local.cidade || "",
            bairro: local.bairro || "",
            score: diag.score,
            want_kit: true,
            ...gaIds(),
          }),
        });
        const data = await r.json();
        if (!r.ok || !data.url) throw new Error(data.error || "Não foi possível gerar o pagamento.");
        try { if (window.gtag) gtag("event", "radar_lead", { valor: 599 }); } catch (e) {}
        redirectWithConversion(data.url);
      } catch (e) {
        err.innerHTML = '<div class="lf-err">' + (e.message || "Erro ao gerar o pagamento.") + '</div>';
        btn.disabled = false;
        btn.textContent = label;
      }
    });
  }

  // ===================== fluxo =====================
  async function load(){
    let diag;
    try {
      const r = await fetch("/api/radar?code=" + encodeURIComponent(CODE));
      if (!r.ok) throw new Error("not found");
      diag = await r.json();
      if (!diag || !diag.code) throw new Error("empty");
    } catch {
      location.replace("/radar");
      return;
    }

    // Monta a página inteira: hero → o que encontramos (prova) → por que → o
    // tratamento (Protocolo) → bastidores → oferta (checkout).
    $("page").innerHTML =
      renderHero(diag) +
      renderDiagnostico(diag) +
      renderPorque(diag) +
      renderProtocolo() +
      renderBastidores() +
      renderOferta(diag);
    $("boot").style.display = "none";
    $("page").style.display = "";
    $("pagefoot").style.display = "";
    window.scrollTo({ top: 0 });

    // Fade-up discreto conforme as seções entram na tela.
    if ("IntersectionObserver" in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
      }, { threshold: 0.1, rootMargin: "0px 0px -6% 0px" });
      document.querySelectorAll(".reveal-up").forEach(el => io.observe(el));
    } else {
      document.querySelectorAll(".reveal-up").forEach(el => el.classList.add("in"));
    }

    // Checkout só existe no DOM depois do innerHTML acima.
    wireCheckout(diag);

    const cta = $("ctaWa");
    if (cta) cta.addEventListener("click", () => {
      const p = { origem: ORIGEM };
      if (typeof lastPend === "number") p.pendencias = lastPend;
      if (window.gtag) gtag("event", "plano_cta_click", p);
    });

    // Ranking LOCAL (grade) — fire-and-forget.
    if (diag.place_id) {
      fetch("/api/diagnostico?grid=1&place_id=" + encodeURIComponent(diag.place_id))
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (d && d.grid) fillLocalRank(d.grid); })
        .catch(() => {});
    }

    // Auditoria ao vivo (por baixo): chips do hero + contagem de pontos.
    // Itens técnicos NÃO vão pra tela — só o número, sem jargão.
    if (diag.place_id) {
      try {
        const url = "/api/audit?place_id=" + encodeURIComponent(diag.place_id) +
          (diag.site ? "&site=" + encodeURIComponent(diag.site) : "");
        const a = await fetch(url);
        if (a.ok) {
          const audit = await a.json();
          fillBlocoAChips(audit.business);
          lastPend = typeof audit.pendencias === "number" ? audit.pendencias : null;
          fillSolucao(lastPend, diag.nome);
        }
      } catch { /* narrativa segue sem a contagem */ }
    }

    firePlanoView(lastPend);
  }

  load();
})();
</script>
