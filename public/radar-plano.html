<meta name="robots" content="noindex, nofollow"/>
<title>Seu plano de trabalho — StarTouch</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/startouch-vars.css"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<style>
  :root{
    --brand:#1A73E8; --brand-hover:#174EA6; --brand-050:#E8F0FE;
    --ink:#111827; --ink-2:#4B5563; --ink-3:#80868B;
    --bg:#FFFFFF; --surf:#F8F9FA; --surf-2:#F1F3F4; --border:#E5E7EB;
    --ok:#1E8E3E; --ok-bg:#E6F4EA; --ok-bd:#A8DAB5;
    --bad:#A50E0E; --bad-bg:#FCE8E6; --bad-bd:#F5C6C0;
    --warn:#7A5900; --warn-bg:#FEF7E0; --warn-bd:#FDE68A;
    --na:#80868B; --na-bg:#F1F3F4;
    --dark:#0B1A33; --dark-hi:#8AB4F8; --dark-sub:#A9B6CC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--surf);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5;}
  a{text-decoration:none;color:inherit;}
  .tnums{font-variant-numeric:tabular-nums;}
  .wrap{max-width:600px;margin:0 auto;padding:0 20px 72px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px;max-width:600px;margin:0 auto;padding-left:20px;padding-right:20px;}
  .logo img{height:40px;width:auto;display:block;}
  .eyebrow{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.09em;color:var(--brand);}

  /* Estados de carregamento / erro */
  .boot{text-align:center;padding:80px 20px;color:var(--ink-2);}
  .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .block{margin-bottom:16px;}
  .btag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;padding:4px 9px;border-radius:999px;margin-bottom:12px;}
  .btag svg{width:12px;height:12px;}

  /* Bloco A — banda escura */
  .impact{background:var(--dark);color:#fff;border-radius:18px;padding:24px 22px;}
  .impact h2{font-size:22px;font-weight:800;letter-spacing:-0.02em;text-wrap:balance;margin-bottom:4px;}
  .impact .sub{color:var(--dark-sub);font-size:13.5px;margin-bottom:18px;}
  .ring-row{display:flex;align-items:center;gap:18px;margin-bottom:18px;}
  .ring{position:relative;width:96px;height:96px;flex:0 0 auto;}
  .ring svg{transform:rotate(-90deg);}
  .ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;}
  .ring .val b{font-size:26px;font-weight:800;line-height:1;}
  .ring .val span{font-size:10px;color:var(--dark-sub);text-transform:uppercase;letter-spacing:.05em;}
  .ring-meta .k{font-size:12px;color:var(--dark-sub);}
  .ring-meta .big{font-size:15px;font-weight:700;margin:2px 0 10px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:7px 11px;font-size:12.5px;}
  .chip b{color:#fff;} .chip span{color:var(--dark-sub);}
  .reveal{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 15px;}
  .reveal .q{font-size:12px;color:var(--dark-hi);margin-bottom:9px;line-height:1.5;}
  .reveal .q b{color:#fff;}
  .compbar{display:flex;align-items:center;gap:10px;margin:7px 0;}
  .compbar .nm{font-size:13px;width:120px;flex:0 0 auto;color:#e8eefb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .compbar .track{flex:1;height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;}
  .compbar .fill{height:100%;background:var(--dark-hi);border-radius:999px;}
  .miss{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);font-size:13.5px;font-weight:700;color:#FCA5A5;display:flex;align-items:center;gap:8px;}
  .localrank{margin-top:14px;}
  .lr{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;font-size:13.5px;color:#e8eefb;line-height:1.5;display:flex;align-items:flex-start;gap:8px;}
  .lr b{color:#fff;} .lr-sub{color:var(--dark-sub);}
  .lr svg{width:18px;height:18px;stroke:var(--dark-hi);flex-shrink:0;margin-top:1px;}
  .lr.miss-lr svg{stroke:#FCA5A5;}
  .miss.inrank{color:#7EE2A8;}

  /* Cartão de prova — a resposta literal da IA, dentro da banda escura.
     Tipografia de citação, não de dashboard: é o argumento da página. */
  .ev{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:15px;margin-bottom:16px;}
  .ev-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .ev-engine{font-size:11.5px;font-weight:800;color:var(--dark-sub);text-transform:uppercase;letter-spacing:.05em;}
  .ev-flag{font-size:11px;font-weight:800;border-radius:6px;padding:3px 8px;white-space:nowrap;}
  .ev-flag.no{background:rgba(252,165,165,.16);color:#FCA5A5;}
  .ev-flag.ok{background:rgba(126,226,168,.16);color:#7EE2A8;}
  .ev-q{font-size:14px;font-weight:700;color:#fff;line-height:1.45;}
  /* pre-line preserva as quebras da lista que a IA escreveu (um concorrente por
     linha) sem deixar o HTML colapsar tudo num parágrafo só. */
  .ev-a{margin:11px 0 0;padding:2px 0 2px 12px;border-left:2px solid var(--dark-hi);color:#C7D5EA;font-size:13.5px;line-height:1.7;white-space:pre-line;}
  .ev-hl{font-weight:800;color:#fff;}                    /* concorrentes citados */
  .ev-me{font-weight:800;color:#8AB4F8;}                 /* o negócio do dono */
  .ev-comp{margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px;color:var(--dark-sub);line-height:1.5;}
  .ev-comp b{color:#fff;}
  /* Liga o veredito do cartão ("não citou você") à estatística logo abaixo
     ("apareceu em 2 de 6"). Sem ela os dois números parecem se contradizer. */
  .ev-bridge{margin-top:10px;font-size:12.5px;color:var(--dark-sub);line-height:1.5;}
  .ev-bridge b{color:#fff;}
  .ev-comp + .ev-bridge{margin-top:6px;border-top:0;padding-top:0;}

  /* Nicho × busca ampla. Duas linhas e uma conclusão — só quando há contraste. */
  .bt{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.12);}
  .bt-title{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--dark-sub);margin-bottom:9px;}
  .bt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;}
  .bt-row + .bt-row{border-top:1px solid rgba(255,255,255,.06);}
  .bt-term{font-size:13.5px;color:#e8eefb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bt-count{font-size:12.5px;font-weight:800;border-radius:6px;padding:3px 9px;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .bt-count.ok{background:rgba(126,226,168,.16);color:#7EE2A8;}
  .bt-count.no{background:rgba(252,165,165,.16);color:#FCA5A5;}
  .bt-punch{margin-top:11px;font-size:13px;color:#e8eefb;line-height:1.55;}
  .bt-punch b{color:#fff;}
  .miss svg{width:16px;height:16px;flex:0 0 auto;}

  /* Bloco B — orçamento de oficina */
  .audit h2{font-size:22px;font-weight:800;letter-spacing:-0.02em;margin-bottom:3px;}
  .audit .sub{color:var(--ink-2);font-size:13.5px;margin-bottom:16px;}
  .group{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:6px 16px;margin-bottom:12px;}
  .group > h3{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-3);margin:14px 2px 4px;}
  .row{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--surf-2);}
  .row:first-of-type{border-top:0;}
  .ic{width:22px;height:22px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;margin-top:1px;}
  .ic svg{width:14px;height:14px;stroke-width:2.4;}
  .ic.pass{background:var(--ok-bg);} .ic.pass svg{stroke:var(--ok);}
  .ic.fail{background:var(--bad-bg);} .ic.fail svg{stroke:var(--bad);}
  .ic.na{background:var(--na-bg);} .ic.na svg{stroke:var(--na);}
  .row .lab{font-size:14px;font-weight:600;color:var(--ink);}
  .row .det{font-size:12.5px;color:var(--ink-2);margin-top:2px;}
  .row.na .lab,.row.na .det{color:var(--ink-3);}
  .empty-note{padding:14px 2px;font-size:13px;color:var(--ink-2);line-height:1.5;}
  .audit-loading{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:13px;padding:14px 2px;}
  .audit-loading .sp{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;}
  .foot{margin-top:4px;background:var(--bad-bg);border:1px solid var(--bad-bd);color:#7a1c14;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;}
  .foot.clean{background:var(--ok-bg);border-color:var(--ok-bd);color:#155e2b;}
  .foot .n{font-size:22px;font-weight:800;}
  .foot svg{width:20px;height:20px;flex:0 0 auto;}

  /* Bloco C — oferta */
  .offer{background:var(--dark);color:#fff;border-radius:18px;padding:24px 22px;}
  .offer h2{font-size:22px;font-weight:800;letter-spacing:-0.02em;text-wrap:balance;margin-bottom:14px;}
  .incl{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:9px;}
  .incl li{display:flex;gap:10px;font-size:13.5px;color:#e8eefb;}
  .incl li svg{width:17px;height:17px;stroke:var(--dark-hi);flex:0 0 auto;margin-top:1px;}
  .price{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
  .price .v{font-size:34px;font-weight:800;letter-spacing:-0.02em;}
  .price .per{color:var(--dark-sub);font-size:14px;}
  .anchor{font-size:12.5px;color:var(--dark-sub);margin-bottom:18px;}
  .anchor b{color:var(--dark-hi);}
  .cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--brand);color:#fff;font-size:15.5px;font-weight:700;height:56px;border-radius:14px;cursor:pointer;transition:background .15s;}
  .cta:hover{background:var(--brand-hover);}
  .cta svg{width:18px;height:18px;stroke:#fff;}
  .undercta{text-align:center;font-size:12px;color:var(--dark-sub);margin-top:11px;}

  /* Checkout do pacote — mudou-se do laudo (/radar, passo 9) pra cá. Vive na
     banda escura, então os campos precisam de contraste próprio. `.cta` já
     estiliza o botão; aqui só o formulário e o botão secundário. */
  .lead-form{display:grid;gap:11px;margin-bottom:4px;}
  .lf-field{display:grid;gap:5px;}
  .lf-field label{font-size:12px;font-weight:700;color:var(--dark-sub);}
  .lf-field input{width:100%;height:50px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;padding:0 14px;font-family:inherit;font-size:15px;outline:none;transition:border-color .15s,background .15s;}
  .lf-field input::placeholder{color:#7C8DA6;}
  .lf-field input:focus{border-color:var(--dark-hi);background:rgba(255,255,255,.1);}
  .lead-form .cta{margin-top:5px;}
  .lead-form .cta:disabled{opacity:.6;cursor:progress;}
  .lf-err{margin-top:9px;background:rgba(252,232,230,.12);border:1px solid #F5C6C0;border-radius:10px;padding:10px 12px;color:#FCA5A5;font-size:13px;line-height:1.45;}
  /* Quem prefere conversar antes de pagar — secundário, não concorre com o CTA. */
  .cta-ghost{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:12px;background:transparent;border:1px solid rgba(255,255,255,.2);color:#D7E3FC;font-size:14px;font-weight:600;height:48px;border-radius:12px;transition:background .15s;}
  .cta-ghost:hover{background:rgba(255,255,255,.07);}
  .cta-ghost svg{width:17px;height:17px;stroke:#D7E3FC;}

  .pagefoot{text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:22px;line-height:1.5;}
  @media (min-width:560px){.impact h2,.audit h2,.offer h2{font-size:25px;}}

  /* ── Narrativa (Por que · Solução · Protocolo · Bastidores) ──────────────────
     Estética de parecer técnico de consultoria, não de dashboard: muito respiro,
     tipografia forte, poucos elementos, quase sem caixas. Fundo claro. */
  .sec{padding:40px 2px;border-top:1px solid var(--border);}
  .sec-eyebrow{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.12em;color:var(--brand);margin-bottom:12px;}
  .sec-h{font-size:26px;font-weight:800;letter-spacing:-0.025em;line-height:1.16;color:var(--ink);text-wrap:balance;margin-bottom:14px;}
  .sec-p{font-size:15.5px;line-height:1.7;color:var(--ink-2);}
  .sec-p + .sec-p{margin-top:14px;}
  .sec-p b{color:var(--ink);font-weight:700;}
  @media(min-width:560px){.sec-h{font-size:30px;}}

  /* Sinais que as IAs leem (seção "por que") */
  .signals{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;}
  .signal{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:8px 14px;}

  /* Contagem de pontos (seção "solução") — preenchida quando a auditoria resolve */
  .sol-count{margin-top:20px;font-size:15px;font-weight:700;color:var(--ink);line-height:1.5;display:none;}
  .sol-count b{color:var(--brand);font-size:17px;}

  /* Protocolo — lista numerada, sem caixas: engenharia, não folheto */
  .proto-badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-2);border:1px solid var(--border);border-radius:999px;padding:6px 13px;margin-bottom:16px;}
  .proto-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px rgba(26,115,232,.15);}
  .pillars{margin-top:24px;}
  .pillar{display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--border);}
  .pillar:first-child{border-top:0;padding-top:4px;}
  .pillar .no{font-size:13px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;flex:0 0 auto;width:26px;padding-top:3px;letter-spacing:0.03em;}
  .pillar .body h4{font-size:16.5px;font-weight:700;color:var(--ink);margin-bottom:5px;letter-spacing:-0.01em;}
  .pillar .body p{font-size:14px;line-height:1.6;color:var(--ink-2);}

  /* Bastidores — o trabalho invisível e contínuo (banda escura) */
  .behind{background:var(--dark);color:#fff;border-radius:18px;padding:26px 22px;}
  .behind h3{font-size:21px;font-weight:800;letter-spacing:-0.02em;line-height:1.2;text-wrap:balance;margin-bottom:18px;}
  .behind .grid{display:grid;gap:12px;margin-bottom:18px;}
  .behind .item{display:flex;gap:11px;font-size:14px;color:#e8eefb;line-height:1.45;align-items:flex-start;}
  .behind .item svg{width:16px;height:16px;stroke:var(--dark-hi);flex:0 0 auto;margin-top:2px;}
  .behind .close{font-size:14px;line-height:1.6;color:var(--dark-sub);border-top:1px solid rgba(255,255,255,.12);padding-top:16px;}
  .behind .close b{color:#fff;}

  /* Fade-up discreto no scroll (respeitando prefers-reduced-motion) */
  .reveal-up{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease;}
  .reveal-up.in{opacity:1;transform:none;}
  @media(prefers-reduced-motion:reduce){.reveal-up{opacity:1 !important;transform:none !important;transition:none;}}
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="/landing" aria-label="StarTouch"><img src="/startouch-logo-dark.png" alt="StarTouch"/></a>
  <span class="eyebrow">Plano de trabalho</span>
</div>

<main class="wrap">
  <div id="boot" class="boot"><div class="spinner"></div><p>Montando seu plano de trabalho…</p></div>
  <div id="page" style="display:none;"></div>
  <div id="pagefoot" class="pagefoot" style="display:none;">
    Diagnóstico gerado a partir de perguntas reais a inteligências artificiais e de dados públicos do seu Google e do seu site.
  </div>
</main>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const CODE = (params.get("code") || "").trim();
  const ORIGEM = (params.get("origem") || "direct").trim();

  // Sem code → não há plano pra mostrar: manda rodar o diagnóstico. replace()
  // pra não deixar a URL quebrada no histórico.
  if (!CODE) { location.replace("/radar"); return; }

  function esc(s){ const d = document.createElement("div"); d.textContent = (s==null?"":String(s)); return d.innerHTML; }

  const ENGINE_LABELS = { gemini:"Gemini", openai:"ChatGPT", perplexity:"Perplexity" };
  function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
  // As IAs respondem em Markdown. Sem tratar, o cliente lê "* **Dona Deôla**:"
  // com os asteriscos na cara. Roda DEPOIS do esc() (texto já seguro) e ANTES do
  // highlight, que injeta <span>. Os negritos do Markdown somem: quem merece
  // destaque aqui são os concorrentes, e disso o highlight cuida.
  function stripMarkdown(t){
    return t
      .replace(/\*\*(.+?)\*\*/g, "$1")        // **negrito**
      .replace(/(^|\n)\s*[*-]\s+/g, "$1• ")   // marcador no início da linha
      .replace(/\s+\*\s+/g, "\n• ")           // marcador INLINE: a IA nem sempre quebra linha
      .replace(/\n{3,}/g, "\n\n");
  }
  // Destaca, no texto JÁ escapado, os nomes da lista. Mais longos primeiro, pra
  // não destacar pedaço de nome. Uma passada só.
  function highlight(escapedText, names, cls){
    const list = (names || []).map(n => (n || "").trim()).filter(Boolean).sort((a,b) => b.length - a.length);
    if (!list.length) return escapedText;
    return escapedText.replace(new RegExp("(" + list.map(escRe).join("|") + ")", "gi"), '<span class="' + cls + '">$1</span>');
  }
  // Escolhe a pergunta mais eloquente entre TODOS os motores: (1) não citado E
  // com concorrentes nomeados — o silêncio fica gritante ao lado de quem
  // apareceu; (2) só não citado; (3) citado (quando aparece em tudo, não
  // inventamos problema). Ver docs/laudo-radar-contrato.md.
  function pickEvidence(diag){
    const todos = [];
    Object.keys(diag.porMotor || {}).forEach(m =>
      (diag.porMotor[m].itens || []).forEach(it => todos.push({ ...it, motor: m })));
    if (!todos.length) return null;
    return todos.find(it => !it.mencionado && (it.concorrentes || []).length)
        || todos.find(it => !it.mencionado)
        || todos.find(it => it.mencionado)
        || todos[0];
  }
  // ── Aparece no NICHO ou na BUSCA AMPLA? ────────────────────────────────────
  // O laudo dizia "2 de 7 buscas" sem revelar QUAIS. Uma dessas perguntas é a de
  // nicho ("padaria artesanal"); as outras são a arena ("padaria"). Separadas,
  // viram o diagnóstico mais util que temos: "você existe pro seu nicho e é
  // invisível na busca ampla" — que é exatamente o que a StarTouch conserta.
  //
  // Classificação: uma pergunta é de nicho se contém um dos `produtos` (os
  // termos extras). Comparação normalizada (minúsculo, sem acento).
  function breakdownPorTermo(diag){
    const produtos = (diag.produtos || []).map(p => normComp(p)).filter(Boolean);
    if (!produtos.length) return null;

    const arena = { termo: diag.categoria || "sua categoria", mencoes: 0, total: 0 };
    const nicho = { termo: (diag.produtos || [])[0] || "", mencoes: 0, total: 0 };

    Object.values(diag.porMotor || {}).forEach(pm => (pm.itens || []).forEach(it => {
      const q = normComp(it.pergunta || "");
      const alvo = produtos.some(p => q.includes(p)) ? nicho : arena;
      alvo.total++;
      if (it.mencionado) alvo.mencoes++;
    }));

    if (!nicho.total || !arena.total) return null;   // sem contraste, sem história
    return { arena, nicho };
  }

  function renderBreakdown(diag){
    const b = breakdownPorTermo(diag);
    if (!b) return "";
    const { arena, nicho } = b;
    const linha = (x, destaque) =>
      '<div class="bt-row">' +
        '<span class="bt-term">' + esc(x.termo) + '</span>' +
        '<span class="bt-count ' + (x.mencoes ? "ok" : "no") + '">' +
          (x.mencoes ? x.mencoes + ' de ' + x.total : '0 de ' + x.total) +
        '</span>' +
      '</div>';

    // A frase só existe quando há CONTRASTE. Sem contraste seria ruído — ou pior,
    // uma conclusão inventada.
    let punch = "";
    if (!arena.mencoes && nicho.mencoes)
      punch = 'Você aparece quando pedem <b>' + esc(nicho.termo) + '</b> — e some quando pedem <b>' + esc(arena.termo) + '</b>. Quem não conhece você ainda, não te encontra.';
    else if (arena.mencoes && !nicho.mencoes)
      punch = 'Você aparece na busca ampla por <b>' + esc(arena.termo) + '</b>, mas não em <b>' + esc(nicho.termo) + '</b> — onde a concorrência é menor.';

    return '<div class="bt">' +
      '<div class="bt-title">Em quais buscas você aparece</div>' +
      linha(arena) + linha(nicho) +
      (punch ? '<div class="bt-punch">' + punch + '</div>' : '') +
    '</div>';
  }

  // O cartão de prova. A resposta literal da IA é o argumento — um score é uma
  // opinião nossa, isto é um fato.
  function renderEvidence(diag){
    const it = pickEvidence(diag);
    if (!it || !it.resposta) return "";
    const presente = (diag.mencoes || 0) === (diag.total || 0) && (diag.total || 0) > 0;
    let corpo = stripMarkdown(esc(it.resposta));
    corpo = highlight(corpo, it.concorrentes, "ev-hl");
    corpo = highlight(corpo, [diag.nome], "ev-me");
    const citou = (it.concorrentes || []).length

      : "";

    // Reconciliação. O cartão mostra a resposta MAIS DURA (pickEvidence), e logo
    // abaixo a estatística diz "apareceu em 2 de 6 buscas". Sem esta linha, os
    // dois números parecem se contradizer: "não citou você" × "apareceu em 2".
    // Aqui a gente liga um no outro, em voz alta.
    const m = diag.mencoes || 0, t = diag.total || 0;
    let ponte = "";
    if (t > 0) {
      if (presente)      ponte = 'E não foi só aqui: você foi citado em <b>todas as ' + t + '</b> buscas que fizemos.';
      else if (m === 0)  ponte = 'E não foi só aqui: você não foi citado em <b>nenhuma</b> das ' + t + ' buscas que fizemos.';

    return '<div class="ev">' +
      '<div class="ev-head"><span class="ev-engine">' + esc(ENGINE_LABELS[it.motor] || it.motor) + ' respondeu</span>' +
        '<span class="ev-flag ' + (presente ? "ok" : "no") + '">' + (presente ? "✓ citou você" : "✗ não citou você") + '</span></div>' +
      '<div class="ev-q">"' + esc(it.pergunta) + '"</div>' +
      '<blockquote class="ev-a">' + corpo + '</blockquote>' +

  // ===================== BLOCO A (dados reais do /api/radar) =====================
  function ringDash(score){ const r=42, c=2*Math.PI*r; return { c, off:c*(1-Math.max(0,Math.min(100,score))/100), r }; }

  // Mesma regra do consolidateCompetitors do backend (api/_lib/radar/score.js):
  // a IA chama o mesmo negócio de "Dona Deôla" e "Dona Deôla - Alto da Lapa".
  // Sem fundir, o dono via dois concorrentes onde há um, cada um com metade da
  // frequência. Funde só quando um nome é prefixo do outro numa fronteira de
  // palavra — "Padaria Dara" e "Padaria Daniela" continuam separados.
  const normComp = (s) => (s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  function mesmoNegocio(a, b){
    if (a === b) return true;
    const [curto, longo] = a.length <= b.length ? [a, b] : [b, a];
    return longo.startsWith(curto) && /^[\s\-–—,:|]/.test(longo.slice(curto.length));
  }
  function competitorsFromDiag(diag){
    const grupos = [];
    Object.values(diag.porMotor || {}).forEach(pm => (pm.itens || []).forEach(it => {
      (it.concorrentes || []).forEach(c => {
        const nome = (c||"").trim(); const k = normComp(nome); if (!k) return;
        const g = grupos.find(x => mesmoNegocio(x.key, k));
        if (g) { g.n++; if (nome.length < g.name.length) { g.name = nome; g.key = k; } }
        else grupos.push({ key:k, name:nome, n:1 });
      });
    }));
    let ranked = grupos.sort((a,b) => b.n - a.n).slice(0, 4);
    if (!ranked.length) ranked = (diag.concorrentes || []).slice(0, 4).map(n => ({ name: n, n: 0 }));
    return ranked;
  }

  function renderBlocoA(diag){
    const { c, off, r } = ringDash(diag.score);
    const total = diag.total || 0;
    const ranked = competitorsFromDiag(diag);
    const maxN = Math.max(1, ...ranked.map(x => x.n));
    const comps = ranked.map(x => {
      const w = x.n ? Math.round((x.n / maxN) * 100) : 40; // sem freq (fallback) usa largura neutra
      return '<div class="compbar"><div class="nm">' + esc(x.name) + '</div>' +
        '<div class="track"><div class="fill" style="width:' + Math.max(12, w) + '%"></div></div></div>';
    }).join("");

    // Motor real pra rotular a "pergunta" (usa o primeiro que rodou).
    const motores = Object.keys(diag.porMotor || {});
    const engineLabel = motores.length ? (ENGINE_LABELS[motores[0]] || "IA") : "IA";
    // Pergunta real (a 1ª do motor), se existir; senão monta pela categoria/cidade.
    let pergunta = "";
    const firstItens = motores.length ? (diag.porMotor[motores[0]].itens || []) : [];
    if (firstItens.length && firstItens[0].pergunta) pergunta = firstItens[0].pergunta;
    else pergunta = "qual a melhor " + (diag.categoria || "opção") + " em " + (diag.cidade || "sua região") + "?";

    const appeared = (diag.mencoes || 0) > 0;
    const missTxt = appeared
      ? "A " + esc(diag.nome) + " apareceu em " + diag.mencoes + " de " + total + " buscas."
      : "A " + esc(diag.nome) + " não apareceu em nenhuma das " + total + " buscas.";

    // A PROVA vem antes da estatística: primeiro a resposta literal da IA (o
    // fato), depois quem ela cita e com que frequência (a medida).
    const evidence = renderEvidence(diag);

    // Com o cartão de prova acima, repetir a pergunta aqui era eco. Se o cartão
    // não renderizar (motor sem `resposta`), a pergunta volta — senão a barra de
    // concorrentes apareceria sem contexto nenhum.
    const qLine = evidence
      ? '<div class="q">Fizemos <b>' + total + ' buscas</b> como essa. Veja quem as IAs citam:</div>'
      : '<div class="q">Perguntamos ao <b>' + esc(engineLabel) + '</b>: <b>"' + esc(pergunta) + '"</b> → e medimos quem ele cita:</div>';

    const revealBlock = ranked.length ? (
      '<div class="reveal">' +
        evidence +
        qLine +
        comps +
        '<div class="miss ' + (appeared ? "inrank" : "") + '">' + (appeared ? ICON.check : ICON.alert) + ' ' + missTxt + '</div>' +
        renderBreakdown(diag) +
      '</div>'
    ) : (
      '<div class="reveal">' + evidence +
        '<div class="miss ' + (appeared ? "inrank" : "") + '">' + (appeared ? ICON.check : ICON.alert) + ' ' + missTxt + '</div></div>'
    );

    return '<div class="block"><div class="impact">' +
      '<div class="sec-eyebrow" style="color:var(--dark-hi);margin-bottom:10px;">O diagnóstico</div>' +
      '<h2>O que encontramos sobre a ' + esc(diag.nome) + '</h2>' +
      '<div class="sub">O que as inteligências artificiais respondem hoje quando procuram pela sua categoria.</div>' +
      '<div class="ring-row">' +
        '<div class="ring"><svg width="96" height="96">' +
          '<circle cx="48" cy="48" r="' + r + '" stroke="rgba(255,255,255,.14)" stroke-width="8" fill="none"/>' +
          '<circle cx="48" cy="48" r="' + r + '" stroke="var(--dark-hi)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '"/>' +
        '</svg><div class="val"><div><b class="tnums">' + (diag.score || 0) + '</b><span>de 100</span></div></div></div>' +
        '<div class="ring-meta">' +
          '<div class="k">Visibilidade nas IAs</div>' +
          '<div class="big">Taxa de menção</div>' +
          '<div class="chips" id="bizChips"></div>' +
        '</div>' +
      '</div>' + revealBlock +
      '<div class="localrank" id="localRank"></div>' +
    '</div></div>';
  }

  // Ranking LOCAL no Google (grade) — mesma medição do painel. Preenche quando

  function fillLocalRank(grid){
    const box = $("localRank"); if (!box) return;

    if (!t.measured) return;

    if (t.coverage > 0 && t.score != null){

    } else { go(); }
  }

  // Lê client_id/session_id do GA4 (cookies _ga / _ga_<container>) pra amarrar a
  // venda à sessão de origem quando o webhook dispara o `purchase` server-side.
  function gaIds(){
    try {
      const cid = (document.cookie.match(/_ga=GA\d\.\d\.(\d+\.\d+)/) || [])[1] || "";
      const sid = (document.cookie.match(/_ga_HCLV0Z640L=GS\d\.\d\.(\d+)/) || [])[1] || "";
      return { ga_client_id: cid, ga_session_id: sid };
    } catch (_) { return { ga_client_id: "", ga_session_id: "" }; }
  }

  // Checkout do Pacote Presença em IA. Mesmo endpoint de antes; só mudou de casa.
  function wireCheckout(diag){
    const btn = $("contratarBtn");
    if (!btn) return;
    btn.addEventListener("click", async () => {
      const nome = $("leadNome").value.trim();
      const email = $("leadEmail").value.trim();
      const whatsapp = $("leadWhats").value.trim();
      const err = $("leadErr");
      err.innerHTML = "";
      if (!nome || !email) { err.innerHTML = '<div class="lf-err">Preencha seu nome e email.</div>'; return; }
      btn.disabled = true;
      const label = btn.textContent;
      btn.textContent = "Gerando pagamento…";
      try {
        const local = diag.local || {};   // GET /api/radar?code= devolve `local` no topo
        const r = await fetch("/api/billing?action=checkout-ia", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nome, email, whatsapp,
            biz_name: diag.nome || "",
            cidade: local.cidade || "",
            bairro: local.bairro || "",
            score: diag.score,
            want_kit: true, // Kit NFC é brinde incluído no pacote
            ...gaIds(),
          }),
        });
        const data = await r.json();
        if (!r.ok || !data.url) throw new Error(data.error || "Não foi possível gerar o pagamento.");
        try { if (window.gtag) gtag("event", "radar_lead", { valor: 599 }); } catch (e) {}
        redirectWithConversion(data.url);
      } catch (e) {
        err.innerHTML = '<div class="lf-err">' + (e.message || "Erro ao gerar o pagamento.") + '</div>';
        btn.disabled = false;
        btn.textContent = label;
      }
    });
  }

  // ===================== fluxo =====================
  async function load(){
    let diag;
    try {
      const r = await fetch("/api/radar?code=" + encodeURIComponent(CODE));
      if (!r.ok) throw new Error("not found");
      diag = await r.json();
      if (!diag || !diag.code) throw new Error("empty");
    } catch {
      // Code inexistente/expirado/inválido → volta pro /radar (regra do funil).
      location.replace("/radar");
      return;
    }

    // Monta a página inteira de uma vez (dados do diagnóstico já em mãos): a
    // prova (Bloco A) abre; a narrativa — por que acontece, existe solução, o
    // tratamento (Protocolo) e os bastidores — leva até a oferta. A auditoria
    // roda por baixo e preenche as chips do Bloco A + a contagem de pontos.
    $("page").innerHTML =
      renderBlocoA(diag) +
      renderPorQue(diag) +
      renderSolucao() +
      renderProtocolo() +
      renderBastidores() +
      renderBlocoC(diag);
    $("boot").style.display = "none";
    $("page").style.display = "";
    $("pagefoot").style.display = "";
    window.scrollTo({ top: 0 });

    // Fade-up discreto conforme as seções entram na tela (brief: animações
    // discretas). Fallback: sem IntersectionObserver, mostra tudo de uma vez.
    if ("IntersectionObserver" in window) {
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
      }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
      document.querySelectorAll(".reveal-up").forEach(el => io.observe(el));
    } else {
      document.querySelectorAll(".reveal-up").forEach(el => el.classList.add("in"));
    }

    // O Bloco C só existe no DOM depois do innerHTML acima — ligar o checkout
    // antes disso não acharia o botão.
    wireCheckout(diag);

    // CTA → evento GA4 (deixa a navegação seguir; target _blank).
    const cta = $("ctaWa");
    if (cta) cta.addEventListener("click", () => {
      const p = { origem: ORIGEM };
      if (typeof lastPend === "number") p.pendencias = lastPend;
      if (window.gtag) gtag("event", "plano_cta_click", p);
    });

    // Ranking LOCAL (grade) no topo — mesma medição do painel. Fire-and-forget:
    // preenche o elemento quando responde, sem travar a página.
    if (diag.place_id) {
      fetch("/api/diagnostico?grid=1&place_id=" + encodeURIComponent(diag.place_id))
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (d && d.grid) fillLocalRank(d.grid); })
        .catch(() => {});
    }

    // Auditoria ao vivo (roda por baixo): preenche as chips do Bloco A (nota /
    // avaliações do Google) e a contagem de pontos da seção "solução". Os itens
    // técnicos NÃO vão mais pra tela — viram só o número, sem jargão. Falha aqui
    // não quebra a página: a narrativa segue de pé, apenas sem a contagem.
    if (diag.place_id) {
      try {
        const url = "/api/audit?place_id=" + encodeURIComponent(diag.place_id) +
          (diag.site ? "&site=" + encodeURIComponent(diag.site) : "");
        const a = await fetch(url);
        if (a.ok) {
          const audit = await a.json();
          fillBlocoAChips(audit.business);
          lastPend = typeof audit.pendencias === "number" ? audit.pendencias : null;
          fillSolucao(lastPend, diag.nome);
        }
      } catch { /* narrativa segue sem a contagem */ }
    }

    firePlanoView(lastPend);
  }

  load();
})();
</script>
