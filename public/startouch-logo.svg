<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Símbolo da marca em tamanho grande (usado na /avaliar). Mesma arte do
       favicon.svg, mesmas cores amostradas do logotipo — se um mudar, o outro
       muda junto, senão a marca aparece de dois jeitos no mesmo site.
       Aqui cabe o anel do logotipo, que a 16px do favicon não caberia. -->
  <defs>
    <linearGradient id="stFundoG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#015FFC"/>
      <stop offset="100%" stop-color="#082A71"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#stFundoG)"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#FFFFFF" stroke-width="26"
          stroke-linecap="round" stroke-dasharray="1250 635" transform="rotate(-40 512 512)" opacity=".55"/>
  <circle cx="243" cy="404" r="34" fill="#FFFFFF" opacity=".55"/>
  <circle cx="781" cy="620" r="34" fill="#FFFFFF" opacity=".55"/>
  <path d="M512 232 C534 417 607 490 792 512 C607 534 534 607 512 792 C490 607 417 534 232 512 C417 490 490 417 512 232 Z" fill="#FFFFFF"/>
</svg>
