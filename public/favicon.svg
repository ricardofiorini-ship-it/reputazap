<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Ícone da marca StarTouch. Cores amostradas do logotipo (08/09/2026):
       o fundo era VERDE com estrela AMARELA — a identidade anterior ao azul,
       que sobreviveu à troca de marca porque ninguém olha o ícone da aba.
       Aparecia assim em todas as páginas do site.
       Aqui é a estrela de quatro pontas do símbolo, sobre o azul da marca.
       Detalhe fino (o anel e os dois pontos do logotipo) não sobrevive a
       16px, então a redução mantém só o que se lê nesse tamanho. -->
  <defs>
    <linearGradient id="stFundo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#015FFC"/>
      <stop offset="100%" stop-color="#082A71"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#stFundo)"/>
  <path d="M32 11 C33.4 22.6 41.4 30.6 53 32 C41.4 33.4 33.4 41.4 32 53 C30.6 41.4 22.6 33.4 11 32 C22.6 30.6 30.6 22.6 32 11 Z" fill="#FFFFFF"/>
</svg>
