<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-HCLV0Z640L"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-HCLV0Z640L');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Bem-vindo à StarTouch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<style>
  :root{--blue:#1A73E8;--purple:#6D5DFB;--blue-soft:#E8F0FE;--ink:#0F172A;--ink-2:#475569;--ink-3:#64748B;--line:#E2E8F0;--surf:#F8FAFF;--ok:#1E8E3E;--ok-soft:#E6F4EA;--shadow:0 24px 80px rgba(15,23,42,.10);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--surf) radial-gradient(circle at 50% 0%,rgba(26,115,232,.07),transparent 42%) no-repeat;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5;}
  .topbar{max-width:600px;margin:0 auto;padding:20px;}
  .topbar img{height:30px;width:auto;display:block;}
  .wrap{max-width:560px;margin:0 auto;padding:6px 20px 64px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px 28px;box-shadow:var(--shadow);animation:up .4s ease;}
  @keyframes up{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .ok-badge{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:7px 13px;margin-bottom:16px;}
  .ok-badge svg{width:15px;height:15px;stroke:var(--ok);stroke-width:2.6;}
  h1{font-size:28px;font-weight:900;letter-spacing:-.03em;line-height:1.12;}
  .lead{font-size:15.5px;color:var(--ink-2);margin-top:11px;line-height:1.6;}
  .lead b{color:var(--ink);font-weight:700;}
  .field{margin-top:22px;}
  .field label{display:block;font-size:13px;font-weight:800;color:var(--ink);margin-bottom:9px;}
  .field label span{color:var(--ink-3);font-weight:600;}
  .pills{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{font-size:13.5px;font-weight:600;color:var(--ink-2);background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:10px 14px;cursor:pointer;transition:border-color .12s,background .12s,color .12s;font-family:inherit;}
  .pill.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:800;}
  input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-family:inherit;font-size:15px;color:var(--ink);outline:none;transition:border-color .15s;}
  input:focus,textarea:focus{border-color:var(--blue);}
  textarea{resize:vertical;min-height:70px;}
  .submit{width:100%;height:56px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:16px;font-weight:900;cursor:pointer;margin-top:24px;transition:filter .15s;}
  .submit:hover{filter:brightness(1.06);}
  .submit:disabled{opacity:.6;cursor:progress;}
  .note{margin-top:18px;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px;color:var(--ink-2);line-height:1.55;display:flex;gap:10px;}
  .note svg{width:18px;height:18px;stroke:var(--blue);flex:0 0 auto;margin-top:1px;}
  .note b{color:var(--ink);}
  .err{margin-top:12px;background:#FCE8E6;border:1px solid #F5C6C0;border-radius:10px;padding:10px 12px;color:#A50E0E;font-size:13px;}
  .done{text-align:center;padding:6px 0;}
  .done .big{width:66px;height:66px;border-radius:50%;background:var(--ok-soft);display:grid;place-items:center;margin:0 auto 18px;}
  .done .big svg{width:33px;height:33px;stroke:var(--ok);stroke-width:2.6;}
  .wa{display:inline-flex;align-items:center;justify-content:center;gap:9px;margin-top:22px;height:52px;padding:0 22px;border-radius:13px;background:#25D366;color:#fff;font-size:15px;font-weight:800;}
  .wa svg{width:18px;height:18px;stroke:#fff;}
</style>
</head>
<body>
<div class="topbar"><a href="/landing" aria-label="StarTouch"><img src="/startouch-logo-dark.png" alt="StarTouch"/></a></div>
<div class="wrap"><div class="card" id="card"></div></div>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const plano = (params.get("plano") || "").toLowerCase();
  const code = (params.get("code") || "").trim();
  const PLAN_LABEL = { start:"Start", business:"Business", gold:"Gold" };
  let bizName = "";

  const ICON = {
    check:'<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>',
    wa:'<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.2-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>',
  };
  function esc(s){ const d = document.createElement("div"); d.textContent = (s==null?"":String(s)); return d.innerHTML; }

  function renderForm(){
    const planTxt = PLAN_LABEL[plano] ? ("Plano " + PLAN_LABEL[plano]) : "sua assinatura";
    const sub = bizName
      ? 'Sua assinatura do <b>' + esc(planTxt) + '</b> está confirmada. Responda 1 minuto pra já montarmos a primeira leva de trabalho da <b>' + esc(bizName) + '</b>.'
      : 'Sua assinatura do <b>' + esc(planTxt) + '</b> está confirmada. Responda 1 minuto pra já montarmos sua primeira leva de trabalho.';
    $("card").innerHTML =
      '<div class="ok-badge">' + ICON.check + ' Assinatura confirmada</div>' +
      '<h1>Bem-vindo à StarTouch!</h1>' +
      '<p class="lead">' + sub + '</p>' +
      '<div class="field"><label>Qual seu maior objetivo agora?</label>' +
        '<div class="pills" id="goals">' +
          ['Mais clientes','Dominar minha região','Lançar um serviço','Outro'].map(g => '<button type="button" class="pill" data-g="' + esc(g) + '">' + esc(g) + '</button>').join("") +
        '</div></div>' +
      '<div class="field"><label>Seu site e redes sociais</label>' +
        '<input id="obSite" type="text" placeholder="ex: seusite.com.br · @seuinstagram"/></div>' +
      '<div class="field"><label>Algo urgente pra gente priorizar? <span>(opcional)</span></label>' +
        '<textarea id="obUrg" placeholder="ex: tenho um evento mês que vem e quero aparecer mais"></textarea></div>' +
      '<button class="submit" id="obSubmit">Enviar e agendar meu início →</button>' +
      '<div id="obErr"></div>' +
      '<div class="note">' + ICON.info + '<span>Seu especialista vai te chamar no <b>WhatsApp em até 1 dia útil</b> pra alinhar e pedir os acessos (ficha do Google etc.). Enquanto isso, já começamos pela sua ficha do Google.</span></div>';

    let goal = "";
    document.querySelectorAll("#goals .pill").forEach(p => p.addEventListener("click", () => {
      document.querySelectorAll("#goals .pill").forEach(x => x.classList.remove("sel"));
      p.classList.add("sel"); goal = p.getAttribute("data-g");
    }));
    $("obSubmit").addEventListener("click", async () => {
      const site = $("obSite").value.trim();
      const urgente = $("obUrg").value.trim();
      const btn = $("obSubmit"); btn.disabled = true; const lbl = btn.textContent; btn.textContent = "Enviando…";
      try {
        await fetch("/api/billing?action=onboarding", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code, plano, biz_name: bizName, objetivo: goal, site, urgente }),
        });
      } catch (e) { /* mesmo com falha de rede, não travar o cliente */ }
      try { if (window.gtag) gtag("event", "onboarding_complete", { plano }); } catch (e) {}
      renderDone();
    });
  }

  function renderDone(){
    const wa = "https://wa.me/5511976944026?text=" + encodeURIComponent("Oi! Acabei de assinar" + (bizName ? " (" + bizName + ")" : "") + " e quero começar.");
    $("card").innerHTML =
      '<div class="done">' +
        '<div class="big">' + ICON.check + '</div>' +
        '<h1>Tudo certo' + (bizName ? ', ' + esc(bizName) : '') + '!</h1>' +
        '<p class="lead">Recebemos suas informações. Seu especialista StarTouch vai te chamar no <b>WhatsApp em até 1 dia útil</b> pra alinhar e começar o trabalho.</p>' +
        '<a class="wa" href="' + wa + '" target="_blank" rel="noopener">' + ICON.wa + ' Falar agora com a gente</a>' +
      '</div>';
  }

  async function init(){
    if (code) {
      try {
        const r = await fetch("/api/radar?code=" + encodeURIComponent(code));
        if (r.ok) { const d = await r.json(); bizName = (d && d.nome) || ""; }
      } catch (e) {}
    }
    renderForm();
  }
  init();
})();
</script>
</body>
</html>
